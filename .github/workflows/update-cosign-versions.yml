name: Update Cosign Versions

on:
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cosign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run mirror releases script
        run: |
          chmod +x ./scripts/mirror_releases_cosign.sh
          ./scripts/mirror_releases_cosign.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(cosign): update mirrored cosign versions"
          title: "chore(cosign): update mirrored cosign versions"
          body: |
            Automated update of mirrored Cosign release hashes in `cosign/private/versions.bzl`.
            Generated by the weekly `update-cosign-versions` scheduled workflow.
          branch: "update-cosign-versions"
          base: "main"
          delete-branch: true
          signoff: true
